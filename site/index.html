<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GEML has moved</title>
<!-- A page of the old site at geml-spec.github.io/geml/, kept as a page of its
     own rather than left to 404.html: a search engine reads a 404 as gone, but an
     instant refresh to a canonical address as a permanent move. -->
<link rel="canonical" href="https://geml-spec.github.io/">
<meta http-equiv="refresh" content="0; url=https://geml-spec.github.io/">
<script>location.replace("https://geml-spec.github.io/" + location.search + location.hash);</script>
</head>
<body>
<p>GEML has moved to <a href="https://geml-spec.github.io/">https://geml-spec.github.io/</a>.</p>
</body>
</html>
