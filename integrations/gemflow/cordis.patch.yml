# The layer this bundle contributes. Three rows: the first two configure plugins
# that ship inside the dsh installation (`apps/cli` depends on them), so they are
# configuration and skill text only; the third mounts this package's own
# supervisor, which is why the bundle now carries code.
- insert:
    # The geml MCP server, one stdio connection per session. `--root .` confines
    # it to the session's own project directory. The model sees the tools as
    # `mcp__geml__geml_get`, `mcp__geml__geml_set`, … — server-qualified names.
    - id: mcp-geml
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: geml
        transport: stdio
        command: npx
        args: ['-y', '@geml/geml', 'mcp', '--root', '.']

    # The skills travel with this package rather than being copied into the
    # user's skill root: `baseUrl` is this patch file's own directory, so the
    # root resolves wherever the bundle is installed. An isolated provider
    # (`includeDefaultRoots: false`, own `providerName`) contributes these two
    # skills without shadowing or duplicating the user's own roots.
    - id: skill-geml
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: geml
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

    # The supervisor. It attaches per agent at agent/session-start and does
    # nothing at all when the session's working directory holds no workflow —
    # `onMissing: skip` is what keeps this row harmless in a profile that wants
    # only the MCP server and the skills above.
    #
    # `statechart` is left unset on purpose: the workflow is then resolved the
    # way the `gemflow` command resolves it — GEMFLOW_STATECHART, else the one
    # `.geml/gemflow.geml` names, else the only
    # `.geml/workflows/<name>/flow.geml` (relative to the session's working
    # directory). Set `statechart: <path>` to pin one file instead; the path
    # wins over all of that.
    #
    # The row names the adapter MODULE by a path beside this patch, not the
    # package by name. Three reasons, all load-bearing: cordis accepts a
    # function or an object with an `apply` method (lib/index.js
    # `isApplicable`, no `.default` unwrapping), and the package root is the
    # host-agnostic library, which has no `apply`; the root must stay
    # importable for someone who installed Pi instead, so it cannot pull the
    # @deepseek-ai packages in; and dsh-client-modules scans the browser half
    # (`dsh.client` plus `exports["./client"]`) only for rows named by a bare
    # package name or a path — a subpath such as `@geml/gemflow/dsh` yields no
    # package, hence no board tab. dsh-app-boot anchors the relative path
    # beside this file (`anchorInsertedPluginNames`), and the nearest manifest
    # above the module, this package's own, supplies the client bundle.
    - id: gemflow
      name: ./dist/hosts/dsh/plugin.js
      config:
        journalDir: !!js dshHomePath('gemflow')
        onMissing: skip
