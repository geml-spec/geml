name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploy Pages used to be its own workflow and could be run by hand; the two
  # site jobs below live here now, so the button has to live here too.
  workflow_dispatch:

# Read-only by default: CI only checks out and tests. Anything that needs to
# write (a release, a comment) grants itself the token at the job level.
permissions:
  contents: read

jobs:
  # Raising a dependency's version in package.json does not touch the lockfile;
  # only an install does. Every other job here runs `npm ci`, which refuses a
  # manifest and a lockfile that disagree — correctly, since a lockfile IS the
  # reproducible build — but it says so deep inside a job whose red looks like a
  # test failure. `@geml/geml` went to ^1.8.8 while the lockfile still resolved
  # 1.8.6, and that is how it was found.
  #
  # `npm ci --dry-run` is the same judgement in one second and writes nothing.
  # Deliberately NOT "regenerate the lockfile and diff it": that would go red on
  # formatting differences between the npm a developer has and the npm CI has,
  # which is noise, and noise is how a check loses its authority.
  locks:
    name: lockfiles agree with their manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Every package-lock.json satisfies its package.json
        run: |
          set -eu
          status=0
          for manifest in $(git ls-files '*package.json' | grep -v node_modules); do
            dir="$(dirname "$manifest")"
            [ -f "$dir/package-lock.json" ] || continue   # workspace members have none
            echo "── $dir"
            if ! npm --prefix "$dir" ci --dry-run --ignore-scripts >/dev/null; then
              echo "::error file=$dir/package-lock.json::lockfile does not satisfy package.json — run 'npm install --prefix $dir' and commit the lockfile with the manifest"
              status=1
            fi
          done
          exit $status

  parser:
    # The suite spawns the CLI, walks paths, and writes temp files, so it is
    # exactly the kind of code that passes on one OS and fails on another: path
    # separators, CRLF, cmd.exe quoting, case-insensitive filesystems, and the
    # realpath-based confinement gates all differ. Development happens on Windows
    # and CI ran only Linux, so the two were covered by accident and macOS was
    # never covered at all — a matrix is the only way "it passes everywhere" is a
    # fact rather than a hope.
    name: parser — tests + coverage gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let the first platform to fail cancel the others: knowing whether a
      # failure is one-OS or all-OS is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30 # a wedged spawn must fail with logs, not sit for the 6h default
    defaults:
      run:
        working-directory: geml-parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      # The coverage gate runs once, on Linux: thresholds are a property of the
      # code, not of the platform, and instrumenting three times to compare the
      # same numbers only buys minutes of CI.
      - name: Test suite + coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: npm run coverage:check
      - name: Test suite
        if: matrix.os != 'ubuntu-latest'
        run: npm test # `tsc && node test/all.mjs` — dist/ has to exist first

  viewer:
    name: viewer — build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build the reference parser (the viewer imports its dist/)
        working-directory: geml-parser
        run: npm ci && npm run build
      - name: Viewer build + tests + coverage gate
        working-directory: integrations/geml-viewer
        run: npm ci && npm run coverage:check

      # playground/playground.js used to be a COMMITTED artifact, and this job
      # rebuilt it and let `git diff` judge — because it had once gone stale
      # silently, sitting five versions behind (still the 1.7.8 parser, missing
      # 1.8.1's hang fixes) while being the page a Show HN pointed at.
      #
      # The bundle is no longer committed: Deploy Pages builds it. That retires
      # the diff check rather than satisfying it — `git diff` says nothing about
      # an untracked file, so keeping it would have left a step that always
      # passes. What replaces it is that a stale bundle can no longer exist:
      # the only copy is the one built at deploy time. The build itself is still
      # exercised here, because the step below bundles the same renderer.
      #
      # The VS Code preview's bundle is NOT committed (~8 MB of KaTeX and
      # Mermaid; vscode:prepublish rebuilds it), so there is no staleness to
      # check — but nothing else would notice if a renderer change broke the
      # build until someone tried to package a vsix. Same reasoning as above for
      # living in this job: the parser dist and the viewer's node_modules are
      # already here.
      - name: The VS Code preview bundle still builds
        run: npm --prefix integrations/geml-viewer run build:vscode

      # The playground bundle is BUILT HERE and nowhere else. Not because the
      # site's job wants it here, but because this is the only job that has both
      # halves installed — and a fresh runner shares nothing, so building it in
      # the pages job below would mean a second `npm ci` of both packages for a
      # file this job can produce for free. It travels as an artifact instead.
      - name: Build the playground bundle and its fonts
        run: npm --prefix integrations/geml-viewer run build:playground

      - name: Hand the playground bundle to the pages job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-bundle
          path: |
            playground/playground.js
            playground/fonts/
          retention-days: 1
          if-no-files-found: error

      - name: VS Code extension — compile + tests
        working-directory: integrations/vscode
        run: npm ci && npm test

  # ---- the site ------------------------------------------------------------
  # Deploying used to be its own workflow. It lives here so that the playground
  # bundle is built exactly once: the viewer job above already installs the
  # parser and the viewer, and artifacts move between jobs of one workflow
  # without the `workflow_run` chaining a separate workflow would need.
  #
  # Consequences worth knowing. The old `paths:` filter is gone, so a push to
  # main deploys the site even when only the parser changed — which is the point,
  # since the bundle now tracks the parser.
  #
  # `needs: viewer` is the structural minimum: that job produces the artifact.
  # It means a red parser or logseq job does NOT hold the deploy back. Widening
  # it to every test job would make a green suite a precondition for publishing
  # — a policy choice, not a requirement of this layout, so it is not made here.
  pages:
    name: pages — build the site
    needs: viewer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the playground bundle built by the viewer job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playground-bundle
          path: playground

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site

      - name: Build site (Jekyll)
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --source . --destination _site
        working-directory: site

      - name: Graft in the playground (static, non-Jekyll)
        run: cp -r playground site/_site/playground

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy-pages:
    name: pages — deploy
    needs: pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The workflow is read-only by default; this is the one job that publishes,
    # so it grants itself exactly what deploy-pages needs and nothing more.
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deploy at a time, and never cancel one in flight — a half-published
    # site is worse than a late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  logseq:
    name: logseq integration — tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build reference parser
        working-directory: geml-parser
        run: npm ci && npm run build
      - name: Logseq integration tests
        working-directory: integrations/logseq
        run: npm ci && npm test
