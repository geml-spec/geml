name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploy Pages used to be its own workflow and could be run by hand; the two
  # site jobs below live here now, so the button has to live here too.
  workflow_dispatch:

# Read-only by default: CI only checks out and tests. Anything that needs to
# write (a release, a comment) grants itself the token at the job level.
permissions:
  contents: read

jobs:
  # Raising a dependency's version in package.json does not touch the lockfile;
  # only an install does. Every other job here runs `npm ci`, which refuses a
  # manifest and a lockfile that disagree — correctly, since a lockfile IS the
  # reproducible build — but it says so deep inside a job whose red looks like a
  # test failure. `@geml/geml` went to ^1.8.8 while the lockfile still resolved
  # 1.8.6, and that is how it was found.
  #
  # `npm ci --dry-run` is the same judgement in one second and writes nothing.
  # Deliberately NOT "regenerate the lockfile and diff it": that would go red on
  # formatting differences between the npm a developer has and the npm CI has,
  # which is noise, and noise is how a check loses its authority.
  locks:
    name: lockfiles agree with their manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Every package-lock.json satisfies its package.json
        run: |
          set -eu
          status=0
          for manifest in $(git ls-files '*package.json' | grep -v node_modules); do
            dir="$(dirname "$manifest")"
            [ -f "$dir/package-lock.json" ] || continue   # workspace members have none
            echo "── $dir"
            if ! npm --prefix "$dir" ci --dry-run --ignore-scripts >/dev/null; then
              echo "::error file=$dir/package-lock.json::lockfile does not satisfy package.json — run 'npm install --prefix $dir' and commit the lockfile with the manifest"
              status=1
            fi
          done
          exit $status

  parser:
    # The suite spawns the CLI, walks paths, and writes temp files, so it is
    # exactly the kind of code that passes on one OS and fails on another: path
    # separators, CRLF, cmd.exe quoting, case-insensitive filesystems, and the
    # realpath-based confinement gates all differ. Development happens on Windows
    # and CI ran only Linux, so the two were covered by accident and macOS was
    # never covered at all — a matrix is the only way "it passes everywhere" is a
    # fact rather than a hope.
    name: parser — tests + coverage gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let the first platform to fail cancel the others: knowing whether a
      # failure is one-OS or all-OS is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30 # a wedged spawn must fail with logs, not sit for the 6h default
    defaults:
      run:
        working-directory: geml-parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      # The coverage gate runs once, on Linux: thresholds are a property of the
      # code, not of the platform, and instrumenting three times to compare the
      # same numbers only buys minutes of CI.
      - name: Test suite + coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: npm run coverage:check
      - name: Test suite
        if: matrix.os != 'ubuntu-latest'
        run: npm test # `tsc && node test/all.mjs` — dist/ has to exist first

  # The second implementation (geml-parser-rs/), written from the spec and the
  # conformance suite alone. It runs the suite twice: natively, through its own
  # harness, and as WebAssembly through the suite's _runner.mjs and
  # _project.mjs, so the model the wasm module returns is read by the suite's
  # projection rather than by any code of the crate. Both declare every
  # capability the manifest names, so no case is skipped. The vocabularies'
  # conformance files and the specification's history sidecar run through the
  # wasm build too.
  parser-rs:
    name: parser-rs — conformance (native + wasm) + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: geml-parser-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup target add wasm32-unknown-unknown
          cargo install cargo-llvm-cov --locked --version 0.9.1
          cargo install wasm-pack --locked --version 0.13.1
      - name: Format and lint
        run: cargo fmt --check && cargo clippy --all-targets --features wasm -- -D warnings
      # Branch coverage needs a nightly compiler, so the gate holds the three
      # measures stable Rust reports: lines, regions and functions.
      - name: Tests + coverage gate (lines, regions, functions >= 95%)
        run: cargo llvm-cov --fail-under-lines 95 --fail-under-regions 95 --fail-under-functions 95
      - name: WebAssembly build + the suite's own harness
        run: |
          wasm-pack build --target nodejs --out-dir wasm/pkg --release -- --features wasm
          node wasm/conformance.mjs
          node wasm/edits.mjs
          node wasm/profiles.mjs

  viewer:
    name: viewer — build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build the reference parser (the viewer imports its dist/)
        working-directory: geml-parser
        run: npm ci && npm run build
      - name: Viewer build + tests + coverage gate
        working-directory: integrations/chrome-geml-viewer
        run: npm ci && npm run coverage:check

      # The VS Code preview's bundle is NOT committed (~8 MB of KaTeX and
      # Mermaid; vscode:prepublish rebuilds it), so there is no staleness to
      # check — but nothing else would notice if a renderer change broke the
      # build until someone tried to package a vsix. It lives in this job
      # because the parser dist and the viewer's node_modules are already here.
      - name: The VS Code preview bundle still builds
        run: npm --prefix integrations/chrome-geml-viewer run build:vscode

      - name: VS Code extension — compile + tests
        working-directory: integrations/vscode
        run: npm ci && npm test

  # ---- the site ------------------------------------------------------------
  # The website moved to geml-spec/geml-spec.github.io; website.yml pushes the
  # files it serves that are made from here. What this repository
  # still publishes at geml-spec.github.io/geml/ is site/, a redirect: index.html for
  # the old root, and a 404.html whose script strips the /geml prefix and
  # forwards every old path — the playground, the blog posts, privacy, terms —
  # to the same path on the new site.
  pages:
    name: pages — the redirect
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-pages:
    name: pages — deploy
    needs: pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The workflow is read-only by default; this is the one job that publishes,
    # so it grants itself exactly what deploy-pages needs and nothing more.
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deploy at a time, and never cancel one in flight — a half-published
    # site is worse than a late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  logseq:
    name: logseq integration — tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build reference parser
        working-directory: geml-parser
        run: npm ci && npm run build
      - name: Logseq integration tests
        working-directory: integrations/logseq
        run: npm ci && npm test

  obsidian:
    name: obsidian integration — geml-vault skill tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The suite drives the built CLI the way the skill tells a reader to, so
      # the parser has to exist before it runs.
      - name: Build reference parser
        working-directory: geml-parser
        run: npm ci && npm run build
      - name: Obsidian integration tests
        working-directory: integrations/obsidian
        run: npm ci && npm test
