name: Publish MCP Server

on:
  workflow_dispatch: # Allows you to manually trigger the publish from the GitHub UI

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for GitHub OIDC authentication
      contents: read    # Required to checkout the repository code

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22' # Using Node 22 as required by geml-parser

      - name: Install mcp-publisher
        run: |
          curl -sL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz -o publisher.tar.gz
          tar -xzf publisher.tar.gz
          sudo mv mcp-publisher /usr/local/bin/
          rm publisher.tar.gz

      - name: Authenticate with MCP Registry (OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        # Since your server.json is inside the geml-parser directory, we need to cd into it
        working-directory: ./geml-parser
        run: mcp-publisher publish
