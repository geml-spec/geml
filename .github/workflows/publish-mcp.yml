name: Publish MCP Server

on:
  workflow_dispatch: # Allows you to manually trigger the publish from the GitHub UI

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for GitHub OIDC authentication
      contents: read    # Required to checkout the repository code

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The digest is the one registry_1.8.0_checksums.txt publishes for this
      # archive. This job can mint an OIDC token the registry accepts as this
      # repository, so a binary that is not byte-for-byte that release never runs.
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz -o publisher.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  publisher.tar.gz" | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          rm publisher.tar.gz

      - name: Authenticate with MCP Registry (OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        # Since your server.json is inside the geml-parser directory, we need to cd into it
        working-directory: ./geml-parser
        run: mcp-publisher publish
