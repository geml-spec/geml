name: Publish MCP Server

on:
  workflow_dispatch: # Allows you to manually trigger the publish from the GitHub UI

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for GitHub OIDC authentication
      contents: read    # Required to checkout the repository code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Using Node 22 as required by geml-parser

      - name: Install mcp-publisher
        run: go install github.com/modelcontextprotocol/registry/cmd/mcp-publisher@latest

      # Add the go bin directory to the path so mcp-publisher can be found
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Authenticate with MCP Registry (OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        # Since your server.json is inside the geml-parser directory, we need to cd into it
        working-directory: ./geml-parser
        run: mcp-publisher publish
