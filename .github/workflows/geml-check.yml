name: GEML check

# Dogfood. The spec, the comparison, the history spec, the code-map — this repo
# is itself written in GEML. So every commit runs the very GitHub Action we ship
# for everyone else: a dangling [[#id]], a broken cross-document link, or a
# duplicate id in any tracked .geml fails the build. "References can't rot
# silently" — proven on our own documents, not just claimed.

on:
  push:
    branches: [main]
  pull_request:

# Checkout and validate — nothing here writes back to the repo.
permissions:
  contents: read

jobs:
  geml-check:
    name: every .geml parses & references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # THIS commit's documents are checked by THIS commit's parser. The commit
      # that adds a block type carries both the documents that use it and the
      # parser that understands it, so the last published CLI cannot validate
      # them: it degrades the unknown type to raw text (§8.2) and then every
      # reference into it looks broken. Gating on the published package would
      # mean a red main between a spec change and its release. That the shipped
      # package still reads these documents is worth knowing too — the second
      # job below reports it without blocking.
      - name: build the parser from source
        working-directory: geml-parser
        run: npm ci && npm run build
      - name: geml check — all tracked .geml
        uses: ./integrations/geml-check-action
        # The repo's own action, run as-is (true dogfood) — pointed at the CLI
        # built above instead of the npm one.
        with:
          cli: geml-parser/dist/geml.js
          # Explicit grant: docs/comparisons/COMPARISON*.geml legitimately reference
          # ../spec/* and ../README* — widen cross-doc checking to the repo
          # root (escapes past it are still refused). Requires a @geml/geml
          # release with `--root` (> 1.2.2).
          root: "."

      # The other half of the same promise. `geml check` proves references
      # resolve; it says nothing about whether the history beside each document
      # can still be reconstructed. Two spec sidecars sat with an unreadable
      # 24-revision tail for a month because nothing ever asked — the format
      # ships a verb for exactly this, and the repo that ships it was not
      # running it.
      - name: geml history verify — every tracked .gemlhistory
        run: |
          bad=0
          for h in $(git ls-files '*.gemlhistory'); do
            g="${h%.gemlhistory}.geml"
            if node geml-parser/dist/geml.js history verify "$g"; then
              echo "ok   $g"
            else
              echo "FAIL $g"
              bad=$((bad + 1))
            fi
          done
          echo "chains failing: $bad"
          test "$bad" -eq 0

  # The action exactly as an outside repository consumes it: `uses:` with no
  # local build, so the latest published @geml/geml reads these documents. It
  # is expected to lag — between a commit that adds a block type and the
  # release that ships it, the published CLI degrades that type to raw text and
  # reports the references into it as broken. So this reports; it does not
  # block. A failure here after a release is a real problem: the published
  # package can no longer read the repository that ships it.
  published-cli:
    name: the published CLI still reads these documents (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: geml check — all tracked .geml, published CLI
        uses: ./integrations/geml-check-action
        with:
          root: "."
