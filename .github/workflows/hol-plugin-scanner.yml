name: AI plugin scan

# awesome-ai-plugins lists this repo and sweeps it daily with the HOL AI Plugin
# Scanner (hashgraph-online/hol-guard): manifests for the Claude, Codex and
# Gemini plugins, MCP command safety, skill instructions, secrets, shell
# patterns, workflow hygiene. Their sweep is advisory to them but public about
# us, and it fires a day after the commit that caused it. Running the same
# scanner here, at the same thresholds, puts the failure on the commit instead.
#
# The gate mirrors the catalog's: score below 80, or any high-severity finding,
# fails. Two of its heuristics are regex, not analysis — a template literal
# within 30 characters of `exec`/`spawnSync` reads as shell injection, and
# `token: "<8+ chars>"` reads as a hardcoded secret — so a red run may need a
# rephrase rather than a fix (f5ed923 was fourteen of those). The full report
# lands in the job summary; no PR comment, so the job needs nothing but read.
#
# The inputs match what the catalog's SCANNER_GUIDE.md prescribes for CI —
# `plugin_dir: "."`, `min_score: 80`, `fail_on_severity: high`, no `mode` — and
# the action is pinned to the version that guide pins, so a finding here is the
# finding the catalog would raise rather than an artefact of version drift.
#
# `mode: scan` is therefore the default, and NOT `verify`, even though the guide
# names `plugin-scanner verify . --format text` — as its LOCAL check. Tried it:
# verify is not "scan with suppressions off", it is a per-check pass/fail gate
# where a single non-pass fails the run — `min_score` and `fail_on_severity`
# stop participating entirely. What it failed on was one ⚠️, "@geml/dsh-plugin ·
# Cordis apply(ctx) export - Runtime entry point is missing a detectable
# apply(ctx) export", against a plugin that ships cordis.patch.yml and skills/
# and has no JS entry at all by design. That is the regex-not-analysis class
# above, so scan's thresholds are the honest gate here and verify is not.
#
# `online` stays at its default of false: a scan that reaches a network service
# on every push trades a real dependency for findings we have not needed yet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: HOL AI Plugin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the plugin surfaces
        uses: hashgraph-online/ai-plugin-scanner-action@bb4f519048c0fd1cd9d7b42056072d6070b8ad7d # v1.2.651
        with:
          plugin_dir: .
          mode: scan
          format: text
          min_score: 80
          fail_on_severity: high
          pr_comment: "off"
