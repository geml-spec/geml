# Dependency updates. Monthly and grouped, so the automation surfaces stay
# current without turning the PR list into noise. Test fixtures and built
# `dist/` copies are deliberately absent: they pin versions on purpose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - "/geml-parser"
      - "/integrations/chrome-geml-viewer"
      - "/integrations/vscode"
      - "/integrations/obsidian"
      - "/integrations/logseq"
      - "/integrations/dsh-plugin"
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
    # `@types/vscode` must not pass the VS Code extension's `engines.vscode`
    # floor: `vsce package` refuses an extension whose types are newer than the
    # oldest editor it claims to run in. It moves with that floor, by hand.
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: pip
    directory: "/integrations/langchain+llamaindex"
    schedule:
      interval: monthly
