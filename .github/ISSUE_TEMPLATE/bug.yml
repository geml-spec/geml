name: Bug report
description: The reference parser, CLI, or renderer does something wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: input
    attributes:
      label: Minimal GEML input
      description: The smallest .geml that reproduces it.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What you expected, and what happened. Include `geml check` output / diagnostics if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Parser and spec version together, so the report pins both.
      placeholder: "output of `geml --version --json`"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other / several
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Where the wrong behaviour shows. Pick the closest one; mention others in the description.
      options:
        - Reference parser / CLI (`@geml/geml`)
        - MCP server (`geml mcp`)
        - Chrome viewer extension
        - VS Code extension
        - Logseq sync
        - Rust crate (`geml-parser-rs`)
        - Other
    validations:
      required: true
